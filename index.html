<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="theme-color" content="#f6f5f4" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <link rel="canonical" href="" />
    <link rel="icon" href="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/extra.css" />
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
      }
    </script>
    <!-- Laragon serves the ignored runtime config over HTTP. Vercel injects
         VITE_* variables at build time, so it must not resolve this local file. -->
    <script>
      if (window.location.protocol !== 'https:') {
        document.write('<script src="/portfolio.config.js"><\/script>')
      }
    </script>
    <script type="application/ld+json" id="person-jsonld">{}</script>
    <title>Portofolio</title>
  </head>
  <body>
    <a class="skip-link" href="#top">Lewati ke konten utama</a>
    <div class="scroll-progress" data-scroll-progress role="progressbar" aria-label="Progress halaman" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>

    <header class="site-header" data-header>
      <a class="brand" href="/" aria-label="Kembali ke halaman utama">
        <span class="brand__mark" data-site-mark></span>
        <span data-site-name></span>
      </a>
      <nav class="desktop-nav" data-dynamic-navigation aria-label="Navigasi utama"></nav>
      <div class="header-actions">
        <a class="button button--small header-builder" href="/portfolio-builder" data-builder-link hidden></a>
        <a class="button button--small header-cv" data-resume-link hidden></a>
        <button class="icon-button menu-toggle" type="button" data-menu-toggle aria-label="Buka menu" aria-expanded="false" aria-controls="mobile-navigation">
          <span></span><span></span>
        </button>
      </div>
      <nav class="mobile-nav" id="mobile-navigation" data-mobile-nav aria-label="Navigasi mobile"></nav>
    </header>

    <main id="top">
      <section class="hero section-shell" id="hero" aria-labelledby="hero-title">
        <div class="hero__copy">
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-hero-badge></span> <span class="eyebrow__braces">}</span></p>
          <h1 id="hero-title" data-hero-title></h1>
          <p class="hero__intro" data-hero-intro></p>
          <div class="hero__role-selector" data-role-selector aria-label="Pilih fokus profesional"></div>
          <p class="hero__role-description" data-hero-role-description></p>
          <div class="hero__actions">
            <a class="button button--large" href="#work" data-section-primary></a>
            <a class="button button--large button--soft" href="#contact" data-section-secondary></a>
          </div>
          <div class="hero__socials" data-social-links data-social-scope="hero" aria-label="Tautan sosial"></div>
        </div>
        <div class="hero__visual">
          <div class="hero__visual-label"><span class="section-number" data-section-number></span><span data-site-location></span></div>
          <div class="hero__portrait" aria-label="Foto profil portfolio">
          </div>
          <div class="hero__stamp"><span data-availability></span><span>—</span><span data-site-location></span></div>
          <div class="hero__attribution"><span data-site-tagline></span><small data-site-name></small></div>
        </div>
      </section>

      <section class="statement section-shell" id="about" aria-labelledby="statement-title">
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-section-eyebrow></span> <span class="eyebrow__braces">}</span></p>
        </div>
        <div class="section-heading section-heading--split">
          <h2 id="statement-title" data-about-short></h2>
          <div class="statement__aside">
            <p data-about-long></p>
            <div class="public-stats" data-dynamic-stats aria-label="Ringkasan portfolio"></div>
            <div class="about-facts" data-about-facts></div>
            <a class="text-link" href="#contact" data-about-contact-link hidden></a>
          </div>
        </div>
        <div class="about-media" data-about-media>
          <div class="about-media__image" data-about-image></div>
          <div class="about-media__copy">
            <div class="about-highlights" data-about-highlights></div>
            <p data-about-caption></p>
          </div>
        </div>
      </section>

      <section class="capabilities section-shell" id="capabilities" aria-labelledby="capabilities-title">
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-section-eyebrow></span> <span class="eyebrow__braces">}</span></p>
        </div>
        <div class="section-heading section-heading--split">
          <h2 id="capabilities-title"></h2>
          <p></p>
        </div>
        <div class="capability-list" data-dynamic-capabilities></div>
      </section>

      <section class="work section-shell" id="work" aria-labelledby="work-title">
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-section-eyebrow></span> <span class="eyebrow__braces">}</span></p>
        </div>
        <div class="section-heading section-heading--work">
          <div>
            <h2 id="work-title"></h2>
            <p></p>
          </div>
          <div class="filter-row" data-project-filters role="group" aria-label="Filter proyek">
            <label class="search-label">Cari proyek<input class="project-search" type="search" data-project-search placeholder="Judul atau teknologi" aria-label="Cari proyek" hidden /></label>
          </div>
        </div>
        <div class="project-grid" data-dynamic-projects></div>
        <div class="work__footer"><span data-project-count></span><a class="text-link" href="/projects" data-project-list-link hidden></a></div>
      </section>

      <section class="experience section-shell" id="experience" aria-labelledby="experience-title">
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-section-eyebrow></span> <span class="eyebrow__braces">}</span></p>
        </div>
        <div class="section-heading section-heading--split">
          <h2 id="experience-title"></h2>
          <p></p>
        </div>
        <div class="experience-grid" data-dynamic-experiences></div>
      </section>

      <section class="education section-shell" id="education" aria-labelledby="education-title">
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-section-eyebrow></span> <span class="eyebrow__braces">}</span></p>
        </div>
        <div class="section-heading section-heading--split">
          <h2 id="education-title"></h2>
          <p></p>
        </div>
        <div class="education-grid" data-dynamic-educations></div>
      </section>

      <section class="credentials section-shell" id="credentials" aria-labelledby="credentials-title">
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-section-eyebrow></span> <span class="eyebrow__braces">}</span></p>
        </div>
        <div class="section-heading section-heading--split">
          <h2 id="credentials-title"></h2>
          <p></p>
        </div>
        <div class="certificate-grid" data-dynamic-certificates></div>
        <div class="testimonial-grid" data-dynamic-testimonials></div>
      </section>

      <section class="achievements section-shell" id="achievements" aria-labelledby="achievements-title" hidden>
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <span class="eyebrow"></span>
        </div>
        <div class="section-heading section-heading--split">
          <h2 id="achievements-title"></h2>
          <p data-achievements-description></p>
        </div>
        <div class="achievement-grid" data-dynamic-achievements></div>
      </section>

      <section class="notes section-shell" id="notes" aria-labelledby="notes-title" hidden>
        <div class="section-intro">
          <span class="section-number" data-section-number></span>
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-section-eyebrow></span> <span class="eyebrow__braces">}</span></p>
        </div>
        <div class="section-heading section-heading--split">
          <h2 id="notes-title"></h2>
          <p></p>
        </div>
        <div class="notes-grid" data-dynamic-articles></div>
      </section>

      <section class="contact section-shell" id="contact" aria-labelledby="contact-title">
        <span class="section-number" data-section-number></span>
        <div class="contact__content">
          <p class="eyebrow"><span class="eyebrow__braces">{</span> <span data-contact-eyebrow></span> <span class="eyebrow__braces">}</span></p>
          <h2 id="contact-title"></h2>
          <p class="contact__description" data-contact-description></p>
          <a class="button button--large" data-contact-email hidden></a>
          <div class="contact__socials" data-social-links data-social-scope="contact" aria-label="Tautan sosial"></div>
        </div>
        <form class="contact-form" data-contact-form>
          <div class="form-heading"><span>Kirim pesan</span><span><b data-character-count>0/5000</b> · * wajib</span></div>
          <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="contact-honeypot" />
          <label>Nama *<input type="text" name="name" autocomplete="name" placeholder="Nama Anda" required /></label>
          <label>Email *<input type="email" name="email" autocomplete="email" placeholder="nama@perusahaan.com" required /></label>
          <label>Topik<input type="text" name="subject" maxlength="180" placeholder="Topik pesan" /></label>
          <label>Pesan *<textarea name="message" rows="5" maxlength="5000" placeholder="Ceritakan singkat kebutuhan Anda…" required></textarea></label>
          <button class="button button--small" type="submit">Kirim pesan <span aria-hidden="true">↗</span></button>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer__top section-shell">
        <a class="brand" href="/" aria-label="Kembali ke halaman utama"><span class="brand__mark" data-site-mark></span><span data-site-name></span></a>
        <p><span data-site-tagline></span><br /><span data-footer-location></span></p>
        <button class="text-link footer__email" type="button" data-copy-email hidden></button>
      </div>
      <div class="footer__bottom section-shell">
        <span data-footer-copyright></span>
        <div data-dynamic-footer-navigation></div>
      </div>
    </footer>

    <dialog class="project-dialog" data-project-dialog aria-labelledby="dialog-title">
      <div class="project-dialog__inner">
        <button class="icon-button project-dialog__close" type="button" data-dialog-close aria-label="Tutup preview">×</button>
        <p class="eyebrow"></p>
        <p class="dialog__type" data-dialog-type></p>
        <h2 id="dialog-title" data-dialog-title></h2>
        <p data-dialog-description></p>
        <div class="project-dialog__reel"><span></span><strong data-dialog-reel></strong></div>
        <div class="project-dialog__gallery" data-dialog-gallery hidden></div>
        <div class="dialog-actions"><a class="button button--small" data-dialog-detail href="/projects"></a><a class="button button--small button--soft" data-dialog-contact href="#contact"></a></div>
      </div>
    </dialog>
    <dialog class="media-dialog" data-certificate-dialog aria-labelledby="certificate-dialog-title">
      <div class="media-dialog__inner">
        <button class="icon-button media-dialog__close" type="button" data-dialog-close aria-label="Tutup preview">×</button>
        <p class="eyebrow"></p>
        <h2 id="certificate-dialog-title" data-certificate-dialog-title></h2>
        <p data-certificate-dialog-meta></p>
        <img class="media-dialog__image" data-certificate-dialog-image alt="" hidden />
      </div>
    </dialog>
    <div class="toast" data-toast role="status" aria-live="polite"></div>

    <script type="module" src="/script.js?v=20260904-3"></script>
  </body>
</html>
